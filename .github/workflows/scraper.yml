name: Run Scraper

on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true
      user_id:
        required: true
      query:
        required: true
      mode:
        required: true
        default: 'simple'
      location:
        required: false
        default: ''
      grid_zone:
        required: false
        default: ''
      cell_km:
        required: false
        default: '0'
      max_results:
        required: false
        default: '50'
      max_total:
        required: false
        default: '1000'
      scroll_pause:
        required: false
        default: '2.0'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python deps
        run: pip install -r scraper/requirements.txt

      # Cache Chromium binary — ahorra ~90 segundos por job
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('scraper/requirements.txt') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Install Playwright system deps (always)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scraper/scraper_api.py \
            --job-id       "${{ github.event.inputs.job_id }}" \
            --user-id      "${{ github.event.inputs.user_id }}" \
            --supabase-url "$SUPABASE_URL" \
            --supabase-key "$SUPABASE_SERVICE_ROLE_KEY" \
            --query        "${{ github.event.inputs.query }}" \
            --mode         "${{ github.event.inputs.mode }}" \
            --location     "${{ github.event.inputs.location }}" \
            --grid-zone    "${{ github.event.inputs.grid_zone }}" \
            --cell-km      "${{ github.event.inputs.cell_km }}" \
            --max          "${{ github.event.inputs.max_results }}" \
            --max-total    "${{ github.event.inputs.max_total }}" \
            --scroll-pause "${{ github.event.inputs.scroll_pause }}" \
            --headless
